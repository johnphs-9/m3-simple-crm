spring.profiles.active=dev

# JWT settings were moved out of here (user change, 2026-10-30):
#   dev  -> application-dev.properties  (jwt.secret from APP_JWT_SECRET in .env)
#   test -> application-test.properties (jwt.secret from TEST_JWT_SECRET; login creds from APP_USER_*)
# The gitignored .env supplies the secrets; see .env.example for the template.
spring.config.import=optional:file:.env[.properties]