# Dev Server Configuration
spring.application.name=m3-simple-crm
server.port=8080

# H2 Database Configuration
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/simple_crm
# For WSL use: postgres
# For Mac use: your Mac username
spring.datasource.username=postgres
# Leave blank if authentication is set to trust in pg_hba.conf
spring.datasource.password=

# ⚠️ WARNING: 'create' drops and recreates ALL tables on every startup — all existing data will be lost.
# This is acceptable during early development, but switch to 'update' as soon as you want to keep your data.
spring.jpa.hibernate.ddl-auto=create

# JWT configuration (Assignment PT2 §1, J3) — moved out of application.properties.
# The secret comes from APP_JWT_SECRET in the gitignored .env (see .env.example).
# .env is resolved via spring.config.import in application.properties (module root).
jwt.secret=${APP_JWT_SECRET}
jwt.expiration-ms=3600000

# POST /auth/login simple-check credentials (Assignment PT2 §1, J9).
# Sourced from APP_USER_USERNAME / APP_USER_PASSWORD in the gitignored .env
# (assignment defaults: user / password).
app.auth.username=${APP_USER_USERNAME}
app.auth.password=${APP_USER_PASSWORD}