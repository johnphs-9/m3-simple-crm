spring.datasource.url=jdbc:h2:mem:crm-tests;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# JWT configuration (Assignment PT2 §1, J3) — deterministic default for CI/test runs;
# TEST_JWT_SECRET from the .env file overrides it when present.
jwt.secret=${TEST_JWT_SECRET:1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef}
jwt.expiration-ms=3600000

# POST /auth/login simple-check credentials — assignment defaults (user/password);
# TEST_JWT_* equivalents from .env override when present.
app.auth.username=${APP_USER_USERNAME:user}
app.auth.password=${APP_USER_PASSWORD:password}